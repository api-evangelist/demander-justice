name: Demander Justice
description: 'Demander Justice (demanderjustice.com) is a French legal-technology company that lets
  everyday people (justiciables) resolve disputes and take a matter to court without hiring a lawyer.
  Through simplified, guided online procedures it helps users send formal notices (mise en demeure),
  file injonctions de payer, and bring cases before the relevant French courts across consumer, housing,
  telecom, travel, banking, neighbor, and small-claims disputes. The service combines legal information
  fiches with a step-by-step document-generation and court-filing workflow. Backed by Partech; profiled
  in the API Evangelist network under the Consumer sector. No public developer/API surface was found
  at enrichment time.'
